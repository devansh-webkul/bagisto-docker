server {
    listen 80;
    listen [::]:80;
    server_name 192.168.15.114;
    root /var/www/html/bagisto/shared/default/public;

    charset utf-8;

    # Directory listing — no index.php routing, just browse/serve files.
    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Keep dotfiles (e.g. .env) out of reach.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name devansh.webkul.in devansh-c1.webkul.in devansh-c2.webkul.in;
    root /var/www/html/bagisto/shared/devansh/public;

    include /etc/nginx/snippets/bagisto.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name devansh-benchmarking.webkul.in devansh-benchmarking-c1.webkul.in devansh-benchmarking-c2.webkul.in;
    root /var/www/html/bagisto/shared/devansh-benchmarking/public;

    include /etc/nginx/snippets/bagisto.conf;
}
